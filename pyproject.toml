[project]
name = "va"
version = "0.1.0"
description = "Pipecat-based multi-tenant, resellable voice agent platform (Exotel/Telnyx + Deepgram + Gemini + Cartesia)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pipecat-ai[websocket,deepgram,google]==1.12.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "soxr>=1.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jiwer>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["va*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
